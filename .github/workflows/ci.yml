name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The proof service the ZKP tests run against, built from source at a tag.
  GNARK_REPOSITORY: CorpiXo/gnark-gradient-prover
  GNARK_REF: v0.9.0
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: tests (proof service, Concrete-ML)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GNARK_REPOSITORY }}
          ref: ${{ env.GNARK_REF }}
          path: gnark-gradient-prover
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gnark-gradient-prover/go.mod
          cache-dependency-path: gnark-gradient-prover/go.sum
      - name: Build the proof service
        working-directory: gnark-gradient-prover
        run: |
          go build -o gnark_service .
          echo "FL_GNARK_BINARY=$PWD/gnark_service" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # CPU-only torch keeps the CUDA wheels (several GB) off the runner; it is
        # the same torch==2.3.1 the package pins.
        # concrete-ml 1.9.0 pins onnxoptimizer 0.3.13, which has no Python 3.12
        # wheel, so pip builds it from source; its vendored CMakeLists need this
        # to configure under CMake 4.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[tfhe]" pytest
      - name: pytest
        run: pytest tests -ra --junitxml="$RUNNER_TEMP/junit.xml"
      - name: Every test ran
        # With the proof service and Concrete-ML installed nothing may skip; a
        # skip here means a test silently stopped exercising what it claims to.
        run: |
          python - "$RUNNER_TEMP/junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          skipped = [
              f"{case.get('classname')}::{case.get('name')}: {case.find('skipped').get('message')}"
              for case in ET.parse(sys.argv[1]).iter("testcase")
              if case.find("skipped") is not None
          ]
          if skipped:
              print("Skipped with the proof service and Concrete-ML installed:", *skipped, sep="\n  ")
              sys.exit(1)
          print("No test skipped.")
          PY
      # docs/ZKP.md 7.1: a full-size local key set outside every repository. The
      # tests above make their own small keys; this exercises the production
      # circuit sizes end to end.
      - name: Local key setup (docs/ZKP.md 7.1)
        run: |
          "$FL_GNARK_BINARY" setup --keys-dir ~/.cache/ppflx/keys --pk-dir ~/.cache/ppflx/pk
          echo "FL_ZKP_KEYS_DIR=$HOME/.cache/ppflx/keys" >> "$GITHUB_ENV"
          echo "FL_ZKP_PK_DIR=$HOME/.cache/ppflx/pk" >> "$GITHUB_ENV"
      - name: ZKP smoke test (full-size keys)
        run: python scripts/zkp_smoke.py

  test-without-proof-service:
    name: tests (no proof service)
    # Contributors without Go: the ZKP tests must skip cleanly, and everything
    # else must pass without a prover.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest
      - name: pytest
        run: pytest tests -ra
